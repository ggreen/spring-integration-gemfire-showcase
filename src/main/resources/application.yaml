server:
  port: 6007
spring:
  application:
    name: location-service
  data:
    gemfire:
      pool.default.locators: localhost[10334]
integration:
  sqlSelect: "
            SELECT id, 
                first_name as firstName,
                last_name as lastName, 
                email,
                department,
                created_at,
                status  
            FROM company.employees WHERE status = 2
            ORDER BY id
            LIMIT 500"
  sqlUpdate: "UPDATE company.employees SET status = 10 
            WHERE id IN (:id)"
