server:
  port: 6007
spring:
  application:
    name: location-service
  data:
    gemfire:
      pool.default.locators: localhost[10334]
integration:
  sqlSelect: "SELECT id, name, status  
           FROM item WHERE status = 2
           ORDER BY id
          LIMIT 500"
  sqlUpdate: "UPDATE item SET status = 10 
            WHERE id IN (:id)"
